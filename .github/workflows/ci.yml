name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · lint · unit tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://agentarena:agentarena_local_only@127.0.0.1:5432/agentarena?schema=public
      AGENTARENA_MODE: DEMO
      ALLOW_LIVE_EXECUTION: "false"
      SANDBOX_MODE: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Report-only: remaining findings need Next 16 / Prisma 7 majors (see docs/SECURITY.md).
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  integration:
    name: Integration (Postgres + Docker sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentarena
          POSTGRES_PASSWORD: agentarena_local_only
          POSTGRES_DB: agentarena
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentarena" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://agentarena:agentarena_local_only@127.0.0.1:5432/agentarena?schema=public
      TEST_DATABASE_URL: postgresql://agentarena:agentarena_local_only@127.0.0.1:5432/agentarena_test?schema=public
      AGENTARENA_MODE: DEMO
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sandbox:pull
      - run: npm run test:integration

  e2e:
    name: End-to-end (demo mode)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentarena
          POSTGRES_PASSWORD: agentarena_local_only
          POSTGRES_DB: agentarena
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentarena" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://agentarena:agentarena_local_only@127.0.0.1:5432/agentarena?schema=public
      AGENTARENA_MODE: DEMO
      ALLOW_LIVE_EXECUTION: "false"
      SANDBOX_MODE: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sandbox:pull
      - run: npx prisma migrate deploy
      - run: npm run db:seed
        env:
          SEED_ROUNDS: "1"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
